  rationale: On 2026-10-22 the 1.1.1 update shipped with statement semicolons placed inside trailing comments (... // 注释;), producing CS1002, and 1.1.2 inherited the break; the assistant owned the typo in message:assistant-msg-db5625c9-8c80-4d18-91cd-e114b73a7936. The user then hand-edited the fix and typed a fullwidth semicolon '；' under a Chinese IME, so CS1002 persisted ('还是出错呀', message:4b245179-f28a-41d5-a2ad-20c70d3eff82) until whole lines were pasted verbatim ('成功了', message:7339c50b-6aef-4feb-ae01-c8f00ee2c689). The current SKILL.md (read at rev 4ba5c42e72441948f3c0e0e624a28311f52f6ca3dac4573d0119b30f7abbd896) covers project setup, references, and install-folder choice but says nothing about how corrected code is handed off or about stale Visual Studio error lists, so this friction class will recur on every future indicator update. The user's batching discipline (1.0.x versions, confirmed change lists, one delivery per version) makes whole-file replacement the natural fix. This is a new, specific failure class, not covered by any existing skill section.
